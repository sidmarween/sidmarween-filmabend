name: API-Test
on:
  push:
    branches: [apitest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > yt.txt
          for h in NetflixDE netflixdeutschland PrimeVideoDE primevideode DisneyPlusDE disneyplusde AppleTVDE appletvde ParamountPlusDE paramountplusde SkyDeutschland skyde WOWde RTLplus joyn MagentaTV ARDMediathek ZDF ZDFneo arte.de; do
            id=$(curl -sSL -A "Mozilla/5.0" -H "Accept-Language: de" "https://www.youtube.com/@$h" | grep -o '"externalId":"[^"]*"' | head -1 | cut -d'"' -f4)
            name=""
            if [ -n "$id" ]; then
              feed=$(curl -sS "https://www.youtube.com/feeds/videos.xml?channel_id=$id")
              name=$(echo "$feed" | grep -o '<title>[^<]*</title>' | head -1)
              titles=$(echo "$feed" | grep -o '<media:title>[^<]*</media:title>' | head -6 | tr '\n' ' ')
            fi
            echo "$h | $id | $name | $titles" >> yt.txt
          done
          git config user.name bot; git config user.email bot@example.com
          git add yt.txt && git commit -qm yt && git push -q origin apitest
