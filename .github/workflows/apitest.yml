name: API-Test
on:
  push:
    branches: [apitest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 resolve.py || true
          git config user.name bot; git config user.email bot@example.com
          git add resolved.txt && git commit -qm resolved && git push -q origin apitest
