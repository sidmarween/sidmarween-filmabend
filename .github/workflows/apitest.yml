name: API-Test
on:
  push:
    branches: [apitest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          q() { curl -sS -X POST https://mediathekviewweb.de/api/query -H "Content-Type: text/plain" --data "$2" > $1 || true; }
          q f1.json '{"queries":[{"fields":["topic"],"query":"film"}],"sortBy":"timestamp","sortOrder":"desc","future":false,"duration_min":4500,"offset":0,"size":200}'
          q s1.json '{"queries":[],"sortBy":"timestamp","sortOrder":"desc","future":false,"duration_min":1200,"duration_max":4000,"offset":0,"size":500}'
          q t1.json '{"queries":[{"fields":["title"],"query":"trailer"}],"sortBy":"timestamp","sortOrder":"desc","future":false,"offset":0,"size":50}'
          git config user.name bot; git config user.email bot@example.com
          git rm -q --cached *.json 2>/dev/null; git add *.json && git commit -qm out2 && git push -q origin apitest
