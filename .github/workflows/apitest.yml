name: API-Test
on:
  push:
    branches: [apitest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > out.txt
          bash t.sh || true
          git config user.name bot; git config user.email bot@example.com
          git add out.txt && git commit -qm out && git push -q origin apitest
