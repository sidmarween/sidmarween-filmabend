name: API-Test
on:
  push:
    branches: [apitest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > img.txt
          for u in "https://itunes.apple.com/search?term=Odyssee&country=de&media=movie&entity=movie&limit=2" "https://itunes.apple.com/search?term=Odyssee&country=de&media=movie&limit=2" "https://itunes.apple.com/search?term=Odyssee&media=movie&limit=2" "https://itunes.apple.com/search?term=Barbie&country=de&media=movie&entity=movie&limit=2" "https://itunes.apple.com/search?term=Barbie&country=us&media=movie&entity=movie&limit=2" "https://itunes.apple.com/search?term=Tom+Hanks&country=de&media=movie&entity=movie&attribute=actorTerm&limit=2" "https://itunes.apple.com/lookup?id=1873271169&country=de" "https://itunes.apple.com/search?term=Barbie&country=de&entity=movie&limit=2"; do
            echo "== $u" >> img.txt
            curl -sS "$u" | head -c 400 >> img.txt || true
            echo >> img.txt
          done
          git config user.name bot; git config user.email bot@example.com
          git add img.txt && git commit -qm img && git push -q origin apitest
