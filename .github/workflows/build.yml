name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase-Datei aus dem Secret einsetzen
        id: fb
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON fehlt (README, Schritt 2) – nur Testbau, keine Veröffentlichung."
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1","project_id":"test-build","storage_bucket":"test-build.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:1:android:0000000000000000","android_client_info":{"package_name":"de.marween.filmabend"}},
           "oauth_client":[],"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          JSON
            echo "real=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "real=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Filmabend.apk

      - uses: actions/upload-artifact@v4
        if: steps.fb.outputs.real == 'true'
        with:
          name: Filmabend-APK
          path: Filmabend.apk

      - name: Als Release veröffentlichen (Download fürs Handy)
        if: steps.fb.outputs.real == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Filmabend 1.0.${{ github.run_number }}
          files: Filmabend.apk
          make_latest: true
