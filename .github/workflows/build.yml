name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase-Datei aus dem Secret einsetzen
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Das Secret GOOGLE_SERVICES_JSON fehlt – siehe README, Schritt 3."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: APK bauen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Filmabend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Filmabend-APK
          path: Filmabend.apk

      - name: Als Release veröffentlichen (Download fürs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Filmabend 1.0.${{ github.run_number }}
          files: Filmabend.apk
          make_latest: true
